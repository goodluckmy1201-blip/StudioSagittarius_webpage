<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Studio Sagittarius | Creative</title>
  <meta name="description" content="Studio Sagittarius クリエイティブ作品展示用サイト" />
  <meta property="og:title" content="Studio Sagittarius　Creative">
  <meta name="twitter:title" content="Studio Sagittarius　Creative">
  <base href="/" />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --max: 1650px;
      --radius: 16px;
      --shadow: 0 10px 30px rgba(0,0,0,.12);
      --music: #0a84ff;
      --game: #09a66d;
    }
    html,body{height:100%}
    body{
      margin:0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Noto Sans JP, "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
      background:#fff; color:#111; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      /* ▼【追加】モバイル用の背景（フォールバック） */
      background-position:center;
      background-repeat:no-repeat;
      background-size:cover;
    }

    /* ヘッダー */
    .site-header{position: sticky; top:0; z-index:5; background:#000; color:#fff; border-bottom:1px solid #111; box-shadow:0 6px 18px rgba(0,0,0,.22)}
    .site-header .inner{max-width:var(--max); margin:0 auto; padding:16px 24px; display:flex; align-items:center; justify-content:center; transition: padding .25s ease}
    .brand{display:flex; align-items:center; gap:16px}
    .wordmark{font-family:'Orbitron', system-ui, sans-serif; font-weight:800; letter-spacing:.08em; position:relative;
      font-size:clamp(24px, 4vw, 40px); line-height:1; color:transparent;
      background:linear-gradient(90deg,#fafafa,#9ae6ff 35%,#a48bff 70%,#fafafa);
      -webkit-background-clip:text; background-clip:text;
      filter: drop-shadow(0 4px 18px rgba(164,139,255,.25)); transition: filter .25s ease;
    }
    .site-header.shrink .inner{padding:10px 24px}
    .site-header.shrink .wordmark{filter: drop-shadow(0 2px 10px rgba(164,139,255,.18))}
    .wordmark::after{content:""; position:absolute; left:0; right:0; bottom:-8px; height:2px; background:linear-gradient(90deg, transparent, #66e0ff, #a48bff, transparent); opacity:.7}

    .x-link{display:inline-flex; width:52px; height:52px; align-items:center; justify-content:center; border-radius:12px; background:#0b0b0b; border:1px solid #1d1d1d; opacity:.9; transition:opacity .2s ease, transform .2s ease}
    .x-link:hover{opacity:1; transform:translateY(-1px)}
    .x-link:focus-visible{outline:2px solid #66e0ff; outline-offset:2px}
    .x-link svg{width:16px; height:16px; color:#fff}

    .wrap{position:relative; z-index:1; max-width:var(--max); margin:0 auto; padding:24px; padding-bottom: calc(24px + var(--footer-h, 96px));}

    /* ▼PC用の背景レイヤー（固定） */
    .backdrop{position:fixed; inset:0; z-index:0; pointer-events:none; display:flex; justify-content:center; align-items:flex-start; overflow:hidden}
    .bgframe{width:100vw; height:150vh}
    .backdrop img{width:100%; height:100%; object-fit:cover; display:block}

    /* PR動画 */
    .pr{display:grid; place-items:center; margin:18px 0 10px}
    .media-card{width:min(1200px, 100%); background:#fff; border:1px solid #eee; border-radius:var(--radius); box-shadow:var(--shadow); overflow:hidden}
    .yt-lite{position:relative; display:block; background:#000 var(--poster) center/cover no-repeat; aspect-ratio:16/9; cursor:pointer}
    .yt-lite iframe{position:absolute; inset:0; width:100%; height:100%; border:0}
    .yt-lite .yt-play{position:absolute; inset:0; margin:auto; width:72px; height:72px; border-radius:50%; border:none; background:rgba(0,0,0,.55); color:#fff; display:grid; place-items:center; font-size:34px; box-shadow:0 4px 16px rgba(0,0,0,.35)}
    .yt-lite[data-playing="true"] .yt-play{opacity:0; pointer-events:none}

    /* Works */
    .grid{display:grid; grid-template-columns: repeat(12, 1fr); gap:24px; margin:32px 0 72px}
    .tile{grid-column: span 4; display:flex; flex-direction:column; border-radius:var(--radius); overflow:hidden; border:1px solid #eee; background:#fff; box-shadow:var(--shadow)}
    .thumb{display:block; overflow:hidden}
    .thumb img{width:100%; height:auto; display:block; transition: transform .45s ease}
    .tile:hover .thumb img{transform: scale(1.03)}
    .cap{font-size:15px; line-height:1.8; padding:12px 14px; border-top:1px solid #eee; color:#333; background:#fff}
    .cap .label{font-weight:800}
    .cap .label.music{color:var(--music)}
    .cap .label.game{color:var(--game)}
    .cap strong{font-weight:800}
    .cap small{color:#666}
    .cap .tracks{margin:8px 0 0 1.2em; padding:0; list-style:disc; color:#333}
    .cap .tracks li{margin:.2em 0}

    /* レスポンシブ */
    @media (max-width: 1200px){ .media-card{width:min(1000px, 100%)} }
    @media (max-width: 900px){ .tile{grid-column: span 6} }
    @media (max-width: 600px){ .tile{grid-column: span 12} .grid{gap:16px} }

    .sr-only{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0}
    footer{margin:40px 0 32px; color:#fff; font-size:13px; text-align:center}

    .x-link img{width:48px; height:48px; object-fit:contain; display:block}

    .site-footer{position:fixed; left:0; right:0; bottom:0; z-index:4; background:#000; color:#fff; border-top:1px solid #111; box-shadow:0 -6px 18px rgba(0,0,0,.22); margin:0}
    .site-footer .inner{max-width:var(--max); margin:0 auto; padding:10px 24px; display:flex; align-items:center; justify-content:center}
    .footer-banner{display:block; width:min(1100px, 100%); max-height:72px; height:auto; object-fit:contain}

    /* モバイルでも背景レイヤーを表示し、縦長にする */
@media (max-width: 768px){
  .backdrop{
    display:block;           /* ← 以前は none でしたが表示する */
    position:absolute;       /* 固定ではなく通常スクロール */
    top:0; left:0; right:0;
    height:auto;
  }
  .bgframe{
    width:100vw;
    height:300vh;            /* ページが長い想定で余裕を持たせる（必要に応じて 400vh など） */
  }
  .backdrop img{object-fit:cover;}
  /* body 側の背景はオフにして二重表示を避ける */
  body{ background-image:none; }
}

    /* ▼【追加】データ節約モード向け（対応ブラウザ） */
    @media (prefers-reduced-data: reduce){
      .backdrop{display:none;}
      body{ background-image:url("/images/long-bg-mobile.jpg"); }
    }
  </style>
</head>
<body>
  <header class="site-header" role="banner">
    <div class="inner">
      <div class="brand">
        <div class="wordmark" aria-label="Studio Sagittarius ロゴテキスト">Studio Sagittarius</div>
        <a class="x-link" href="https://x.com/BlackBlue_sin" target="_blank" rel="noopener" aria-label="X (Twitter) を開く" title="X">
          <img src="/images/x-icon.png" alt="X" class="x-icon" />
        </a>
      </div>
    </div>
  </header>

  <!-- ▼PCではこちらが効く（モバイルでは非表示に） -->
  <div class="backdrop" aria-hidden="true">
    <div class="bgframe">
      <picture>
        <!-- 高解像度端末向け。必要に応じてサイズを調整してください -->
        <source srcset="/images/long-bg-3840x2560.png 2x, /images/long-bg-1920x1280.png 1x" />
        <img src="/images/long-bg-1920x1280.png" alt="サイト全体の背景ビジュアル" />
      </picture>
    </div>
  </div>

  <div class="wrap">
    <section class="pr" aria-label="PR動画">
      <div class="media-card">
        <div class="yt-lite" id="ytPr" data-yt="https://www.youtube.com/watch?v=VIDEO_ID" style="--poster:url('/images/pr-poster.png')">
          <button class="yt-play" aria-label="再生">▶</button>
        </div>
      </div>
    </section>

    <h2 class="sr-only">Works</h2>
    <section class="grid" aria-label="作品一覧">
      <figure class="tile">
        <a class="thumb" href="https://big-up.style/OQoCb2vBCq" target="_blank" rel="noopener">
          <img src="/images/work-01.png" alt="【MUSIC】Gate of Rebirth サムネイル" loading="lazy" />
        </a>
        <figcaption class="cap">
          <p>
            <span class="label music" style="color:#0a84ff; font-weight:800;">【MUSIC】</span>
            <strong>Gate of Rebirth</strong>
            <br>英雄だった者は、死を司る漆黒の翼により、輪廻の楽園へ還る<br>&mdash; 今、再生の門が開く。
          </p>
          <ul class="tracks">
            <li>Track.01　Gate of Rebirth</li>
            <li>Track.02　HERO X CHALLENGER</li>
            <li>Track.03　Re：incarnation</li>
            <li>Track.04　Gravity Heaven</li>
          </ul>
        </figcaption>
      </figure>

      <figure class="tile">
        <a class="thumb" href="https://store.steampowered.com/app/2455090/Trolley/?l=japanese" target="_blank" rel="noopener">
          <img src="/images/work-02.png" alt="【GAME】Trolley サムネイル" loading="lazy" />
        </a>
        <figcaption class="cap">
          <p><span class="label game">【GAME】</span> <strong>Trolley</strong><br>ひとつのMMORPGで起きる、選択の物語！</p>
          <p>主人公はどこにでもいる普通の男子高校生。<br>ある日、知り合いから「トロリーオンライン」というオンラインゲームを紹介される。<br>ゲームにのめりこんだ彼は、ゲーム内の最上位プレイヤーとなるが、その代償に不登校になってしまった。<br>今の状態が良くないと理解はしているものの、現実世界よりゲーム世界のほうが輝ける。<br>そんな悩みを抱えつつも、今日も「トロリーオンライン」をプレイしていると、一人の不思議なNPC「ハート・エミリア」と出会う。<br>そしてその出会いが、思いもよらない事態へと繋がっていく……。</p>
          <p><small>© YOSHIDA Game Studios</small></p>
        </figcaption>
      </figure>

      <figure class="tile">
        <a class="thumb" href="https://store.steampowered.com/app/2631330/Childhoods_RUSH/" target="_blank" rel="noopener">
          <img src="/images/work-03.png" alt="【GAME】Childhood's RUSH サムネイル" loading="lazy" />
        </a>
        <figcaption class="cap">
          <p><span class="label game">【GAME】</span> <strong>Childhood's RUSH</strong><br>封印された遺跡のうえに成り立つのどかな街を舞台に、子供たちによって繰り広げられる古き良き時代の冒険活劇！</p>
          <p>都会から田舎街に引っ越してきた主人公の少年ブルー。<br>退屈な田舎の生活に嫌気が差して、街はずれを探検していると突如石碑が不思議な力と共に開かれ、中から少女ラヴァが出現する。<br>少女から譲り受けた謎の武器を片手に、石碑から地下へとつながる遺跡に向かうブルー。<br>果たして遺跡に眠る秘密を解き明かすことはできるのか……？！</p>
          <p><small>© YOSHIDA Game Studios</small></p>
        </figcaption>
      </figure>
    </section>

    <footer class="site-footer" role="contentinfo">
      <div class="inner">
        <img class="footer-banner" src="/images/label-wide.png" alt="Studio Sagittarius バナー" />
      </div>
    </footer>
  </div>

  <script>
    // 年表示（要素が無い場合は何もしないように修正）
    (function(){
      const yEl = document.getElementById('year');
      if (yEl) yEl.textContent = new Date().getFullYear();
    })();

    // ヘッダー縮小
    const header = document.querySelector('.site-header');
    const onScroll = () => { if (window.scrollY > 40) header.classList.add('shrink'); else header.classList.remove('shrink'); };
    document.addEventListener('scroll', onScroll, { passive: true });

    // YouTube Lite
    (function(){
      const getYtId = (s) => {
        if(!s) return "";
        let m;
        if((m = s.match(/youtu\.be\/([A-Za-z0-9_-]{6,})/))) return m[1];
        if((m = s.match(/[?&]v=([A-Za-z0-9_-]{6,})/))) return m[1];
        if((m = s.match(/^([A-Za-z0-9_-]{6,})$/))) return m[1];
        return "";
      };
      const buildSrc = (id, params) => {
        const p = params || "rel=0&mute=1&autoplay=1&playsinline=1&controls=0&modestbranding=1&enablejsapi=1";
        return `https://www.youtube.com/embed/${id}?${p}`;
      };
      const load = (el) => {
        if (el.dataset.loaded) return;
        const id = getYtId(el.dataset.yt || el.dataset.ytid || "");
        if (!id) return;
        const iframe = document.createElement('iframe');
        iframe.src = buildSrc(id, el.dataset.params);
        iframe.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
        iframe.loading = "lazy";
        el.appendChild(iframe);
        el.dataset.loaded = "true";
        el.dataset.playing = "true";
      };
      const toggle = (el) => {
        const iframe = el.querySelector('iframe');
        if (!iframe) { load(el); return; }
        const playing = el.dataset.playing === "true";
        const func = playing ? "pauseVideo" : "playVideo";
        iframe.contentWindow && iframe.contentWindow.postMessage(JSON.stringify({event:"command", func, args:[]}), "*");
        el.dataset.playing = playing ? "false" : "true";
      };
      const el = document.getElementById('ytPr');
      if (el){
        if ('IntersectionObserver' in window){
          const io = new IntersectionObserver((entries)=>{
            entries.forEach((e)=>{ if(e.isIntersecting){ load(el); io.disconnect(); } });
          }, { rootMargin: "200px" });
          io.observe(el);
        }
        el.addEventListener('click', (e)=>{ e.preventDefault(); toggle(el); });
      }
    })();
  </script>
  <style id="label-override">.cap .label.music{color:#0a84ff !important;} .cap .label.game{color:#09a66d !important;}</style>
</body>
</html>
